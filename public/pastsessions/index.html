<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manifest Schedule — 2023, 2024 & 2025</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cinzel+Decorative:wght@400;700;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap");

  :root {
    --ink: #2b2419;
    --muted: #6b5f4f;
    --accent: #6f6a44;
    --bg: #ffffff;
    --card: #ffffff;
    --panel: #fbfaf7;
    --rule: #e6dccb;
    --font-cinzel: "Cinzel", serif;
    --font-cinzel-deco: "Cinzel Decorative", serif;
    --font-baskerville: "Libre Baskerville", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-baskerville);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 44px 32px 96px; }

  header.site {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 20px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  header.site h1 {
    font-family: var(--font-cinzel-deco);
    font-size: 34px;
    font-weight: 700;
    margin: 0;
  }
  header.site .brand {
    font-family: var(--font-cinzel-deco);
    font-size: 34px;
    font-weight: 700;
  }

  nav.years {
    display: flex;
    gap: 8px;
    width: fit-content;
    margin: 20px 0 18px;
    padding: 5px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 999px;
  }
  nav.years button {
    background: transparent;
    border: 0;
    padding: 8px 16px;
    font-family: var(--font-cinzel);
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-radius: 999px;
    transition: color 120ms, background 120ms;
  }
  nav.years button:hover { color: var(--ink); }
  nav.years button.active {
    background: #f1eadf;
    color: var(--accent);
    font-weight: 700;
  }

  footer.site #year-meta::before { content: " · "; }
  footer.site #year-organizers { margin-top: 4px; }

  .filter-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin: 0 0 22px;
    flex-wrap: wrap;
  }
  .filter-row label {
    font-family: var(--font-cinzel);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .filter-row select {
    font-family: var(--font-cinzel);
    font-size: 12px;
    line-height: 1.2;
    font-weight: 600;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 7px 28px 7px 12px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='none' stroke='%236b5f4f' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round' d='M1 1l5 5 5-5'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
  }
  .filter-row select:hover { border-color: var(--ink); }

  .day-section {
    border-top: 1px solid var(--rule);
    padding-top: 22px;
    margin-top: 34px;
  }
  .day-section:first-child {
    margin-top: 0;
  }

  h2.day {
    font-family: var(--font-cinzel);
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 14px;
    color: var(--accent);
    scroll-margin-top: 80px;
  }
  h2.day .count {
    font-size: 14px;
    font-style: italic;
    color: var(--muted);
    font-weight: normal;
    margin-left: 8px;
  }
  .session-grid {
    column-count: 4;
    column-gap: 14px;
  }
  .session {
    background: var(--card);
    border: 1px solid var(--rule);
    padding: 10px 12px;
    border-radius: 6px;
    transition: transform 100ms;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(96px, 38%);
    grid-template-rows: auto 1fr;
    gap: 2px 12px;
    min-height: 86px;
    break-inside: avoid;
    margin: 0 0 10px;
  }
  .session:hover { transform: translateY(-1px); }
  #session-tooltip {
    position: fixed;
    display: none;
    width: min(420px, calc(100vw - 32px));
    max-height: min(520px, calc(100vh - 32px));
    overflow: auto;
    background: #2b2419;
    color: #fbfaf7;
    font-family: var(--font-baskerville);
    font-size: 12px;
    font-weight: 400;
    line-height: 1.45;
    padding: 12px 14px;
    border-radius: 6px;
    white-space: pre-wrap;
    pointer-events: none;
    z-index: 1000;
    box-shadow: 0 10px 30px rgba(43, 36, 25, 0.28);
    text-align: left;
  }
  #session-tooltip.visible {
    display: block;
  }
  #session-tooltip .tooltip-meta {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 8px;
    font-family: var(--font-cinzel);
    font-size: 10px;
    font-weight: 700;
    line-height: 1.3;
    color: #f1eadf;
  }
  #session-tooltip .tooltip-location {
    margin-left: auto;
    text-align: right;
  }
  #session-tooltip .tooltip-description {
    white-space: pre-wrap;
  }
  .session .cat-label {
    font-family: var(--font-cinzel);
    font-size: 10px;
    letter-spacing: 0.2px;
    font-weight: 600;
    color: #5d5547;
    opacity: 0.7;
    margin-bottom: 6px;
    grid-column: 1;
    grid-row: 1;
    align-self: start;
  }
  .session .rsvp {
    grid-column: 2;
    grid-row: 1;
    justify-self: end;
    align-self: start;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-cinzel);
    font-size: 11px;
    font-weight: 700;
    color: #5d5547;
    opacity: 0.85;
    line-height: 1;
  }
  .session .rsvp svg {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
  }
  .session .title {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 0;
    color: #2b2419;
    line-height: 1.28;
    grid-column: 1;
  }
  .session .speaker {
    font-family: var(--font-cinzel);
    font-size: 12px;
    color: #5d5547;
    font-style: italic;
    grid-column: 2;
    grid-row: 2;
    justify-self: end;
    align-self: end;
    text-align: right;
    overflow-wrap: break-word;
  }
  .session .speaker-name { display: inline-block; white-space: nowrap; }
  .session a.speaker-name { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
  .session a.speaker-name:hover { color: var(--ink); border-bottom-style: solid; }
  footer.site a { color: inherit; text-decoration: underline; text-decoration-color: var(--rule); }
  footer.site a:hover { text-decoration-color: currentColor; }

  /* Category palette — soft pastels */
  .session[data-cat="talk"]      { background: #edf5fa; border-color: #d6e8f2; }
  .session[data-cat="panel"]     { background: #fff8df; border-color: #f1e6b9; }
  .session[data-cat="workshop"]  { background: #edf8eb; border-color: #d2e8cf; }
  .session[data-cat="demo"]      { background: #e8f6ef; border-color: #cce6d9; }
  .session[data-cat="social"]    { background: #fdecea; border-color: #f1cbc5; }
  .session[data-cat="game"]      { background: #f2eaf8; border-color: #dccbe9; }
  .session[data-cat="performance"]{background: #fff0df; border-color: #f1d3b2; }
  .session[data-cat="wellness"]  { background: #f7edf5; border-color: #e5cfe0; }
  .session[data-cat="office"]    { background: #eaf6f8; border-color: #cee5ea; }

  footer.site {
    margin-top: 48px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  @media (max-width: 600px) {
    .wrap { padding: 24px 16px 60px; }
    header.site h1 { font-size: 28px; }
    h2.day { font-size: 22px; }
    .session-grid { column-count: 1; }
    .session { grid-template-columns: minmax(0, 1fr); }
    .session .speaker {
      grid-column: 1;
      grid-row: auto;
      justify-self: start;
      text-align: left;
    }
  }
</style>
</head>
<body class="year-2025">
<div class="wrap">

<script>
const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

const META = {
  '2025': { dates: 'June 6–8, 2025', organizers: 'David Chee, Rachel Farley & Austin Chen' },
  '2024': { dates: 'June 7–9, 2024', organizers: 'Saul Munn, Rachel Weinberg & Austin Chen' },
  '2023': { dates: 'September 22–24, 2023', organizers: 'Saul Munn, David Chee & Austin Chen' },
};

const YEAR_FILES = {
  '2025': '/pastsessions/events-2025.json',
  '2024': '/pastsessions/events.json',
  '2023': '/pastsessions/events-2023.json',
};

const CATEGORIES = [
  { key: 'wellness',    label: 'Wellness'             },
  { key: 'social',      label: 'Social / Meetup'      },
  { key: 'game',        label: 'Game / Competition'   },
  { key: 'performance', label: 'Performance / Comedy' },
  { key: 'panel',       label: 'Panel / Q&A / Fireside' },
  { key: 'workshop',    label: 'Workshop / Class'     },
  { key: 'demo',        label: 'Demo / Office Hours'  },
  { key: 'talk',        label: 'Talk / Lecture'       },
];

const CAT_LABEL = Object.fromEntries(CATEGORIES.map(c => [c.key, c.label]));

const HIDE_PATTERNS = [
  /\blunch\b/i,
  /\bdinner\b/i,
  /\bbreakfast\b/i,
  /\bbrunch\b/i,
  /\bcuddle\b/i,
  /\bsex\b/i,
  /\bsexual\b/i,
  /\bsexy\b/i,
  /\bnsfw\b/i,
  /\bdoors?\s+open\b/i,
  /\bopening circle\b/i,
  /\bfestival kickoff\b/i,
  /\bkickoff\b/i,
  /\bregistration\b/i,
  /\bvolunteer training\b/i,
  /\bbreak\b/i,
  /\bclosing\b/i,
  /^\s*\[blocked/i,
  /^\s*reserved\s*$/i,
  /\boverflow\b/i,
  /\bjudges huddle\b/i,
  /pitch competition (judges|setup)/i,
];
function shouldHide(title) {
  const t = title || '';
  return HIDE_PATTERNS.some(rx => rx.test(t));
}

function cleanText(text) {
  return (text || '').replace(/\s+/g, ' ').trim();
}

function normalizeTitle(title) {
  return cleanText(title)
    .toLowerCase()
    .replace(/^possible\s+/, '')
    .replace(/[?!.,:;]+$/g, '');
}

function titleCase(text) {
  const smallWords = new Set(['a', 'an', 'and', 'as', 'at', 'but', 'by', 'for', 'from', 'in', 'into', 'nor', 'of', 'on', 'or', 'per', 'the', 'to', 'vs', 'via', 'with']);
  const acronyms = {
    ai: 'AI',
    agi: 'AGI',
    aisi: 'AISI',
    api: 'API',
    ea: 'EA',
    gpt: 'GPT',
    'glp-1': 'GLP-1',
    lgbt: 'LGBT',
    lgbtq: 'LGBTQ',
    llm: 'LLM',
    llms: 'LLMs',
    mats: 'MATS',
    nhk: 'NHK',
    nsfw: 'NSFW',
    optic: 'OPTIC',
    qna: 'Q&A',
    'q&a': 'Q&A',
    rsvp: 'RSVP',
    uk: 'UK',
    usa: 'USA',
  };

  return cleanText(text)
    .split(' ')
    .map((word, index, words) => {
      const lower = word.toLowerCase();
      const bare = lower.replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, '');
      const prefix = word.match(/^[^a-z0-9]*/i)?.[0] || '';
      const suffix = word.match(/[^a-z0-9]*$/i)?.[0] || '';

      if (acronyms[bare]) return prefix + acronyms[bare] + suffix;
      if (word.includes('.') && /[a-z]/i.test(word)) {
        return word.charAt(0).toUpperCase() + word.slice(1);
      }
      if (/[a-z][A-Z]/.test(word.slice(1))) return word;
      if (index > 0 && index < words.length - 1 && smallWords.has(bare)) {
        return lower;
      }
      return word.replace(/\p{L}[\p{L}']*/gu, part =>
        part.charAt(0).toUpperCase() + part.slice(1).toLowerCase()
      );
    })
    .join(' ')
    .replace(/\bAi\b/g, 'AI')
    .replace(/\bQ&a\b/g, 'Q&A');
}

const CATEGORY_OVERRIDES = {
  'acro': 'wellness',
  'ai safety small group': 'social',
  'arts & crafts: build a marble race track': 'workshop',
  'awkwardmaxxing for the socially anxious': 'workshop',
  'balance games and wrestling!': 'game',
  'banterbrush: chill, chat and make art': 'social',
  'big manifold awards ceremony': 'performance',
  'breaking the blank slate: social consequences of genetic screening': 'talk',
  'build the future of universities with me': 'workshop',
  'caramel taste test showdown': 'game',
  'catholic mass at newman parish': 'social',
  'collaborative & higher-order forecasting roundtable': 'panel',
  'cornhole rpg': 'game',
  'descent into dance hell': 'performance',
  'design your own compute market (sf compute)': 'workshop',
  'figgie': 'game',
  'hang out and laugh: monikers': 'game',
  'hot seat (intrusive questions game)': 'game',
  'how ai poker works': 'talk',
  'jazz jam (byo instrument)': 'performance',
  'late night jackbox': 'game',
  'mafia with markets': 'game',
  'manifold lore jeopardy!': 'game',
  'mentor <> mentee speed meeting': 'social',
  'metaculus: $120k ai benchmarking tournament announcement & build-a-bot workshop': 'workshop',
  'minimum viable yom kippur': 'social',
  'nate soares & emmett shear fight about ai': 'panel',
  'niacin hot seat': 'game',
  'noam brown: learning to reason with llms': 'talk',
  'pitch competition setup / rapid fire tips': 'workshop',
  'portfolio construction 2': 'workshop',
  'rare & exotic-ish drama games from australia': 'game',
  'repolarize american politics: how to make the two-party system irrelevant': 'talk',
  'rise into rave heaven': 'performance',
  'simple improv games': 'game',
  'speed friending': 'social',
  'speedfriending': 'social',
  'speedfriending #2': 'social',
  'speedfriending #2 with saul': 'social',
  'speedfriending event #1': 'social',
  'speedfriending event #2': 'social',
  'speedfriending event #3': 'social',
  'speedfriending overflow': 'social',
  'student speed networking': 'social',
  'talk to a theist': 'social',
  'team estimation with a traitor': 'game',
  'top manifold traders discuss trading in real-world markets.': 'panel',
  'trade with the kalshi team': 'demo',
  'try out varuna, an ai forecaster, built by the former cto and the former head of ai at metaculus!': 'demo',
  'weird findings in the last 10 years of exercise science': 'talk',
  "what we've learned doing futarchy for a year": 'talk',
  'how could deep learning work well in the real world?': 'talk',
  'writing & slop': 'panel',
  'writing & slop: roon, scott alexander, gwern, alexander wales': 'panel',
};

const SPEAKER_LINKS = {};
const tooltipEl = document.getElementById('session-tooltip');

function categorize(title, hosts) {
  const t = (title || '').toLowerCase();
  const h = (hosts || '').toLowerCase();
  const all = t + ' || ' + h;

  const override = CATEGORY_OVERRIDES[cleanText(title).toLowerCase()];
  if (override) return override;

  // Wellness — yoga, meditation, jhana, dance class, hygge, barbell
  if (/\b(yoga|meditation|guided meditation|jhana|barbell|hygge|dance class|grieving|psychological growth|meditat)/.test(t)) return 'wellness';
  // Performance — comedy, karaoke, theater, screening, music, magic
  if (/\b(karaoke|comedy|theater|screening|movie|night market|dance party|stand[\s-]?up|music|magic|talent)\b/.test(t)) return 'performance';
  // Game / competition — poker, chess, trivia, clocktower, tournament, game show, cardinality, sock wrestle
  if (/\b(poker|chess|bughouse|trivia|tournament|clocktower|game show|cardinality|sock wrestle|origami|estimation game|nash pit|operant conditioning game|crystal coinflip|dumb pitch|pitch competition|startup pitch|speed friending|speed meeting|speedfriend|mentor.*mentee)\b/.test(t)) return 'game';
  // Social — meetup, mixer, party, hangout, gathering, social, friends, lgbt, parents, founders meetup
  if (/\b(meetup|mixer|party|hangout|gathering|social|meet[\s-]?up|friends?|lgbt|gay|parents meetup|founders meetup|shabbat|whales|degens|mira|founders meetup)\b/.test(all)) return 'social';
  // Office Hours / Q&A / Fireside / Panel
  if (/\b(office hours|q&a|q ?and ?a|fireside|panel|debate|interviews?|conversation|discussion)\b/.test(t)) return 'panel';
  // Workshop / class / training / build-a-bot / lesson
  if (/\b(workshop|class|training|build[\s-]?a[\s-]?bot|how to|intro to|101|tutorial|exercise|hands[\s-]?on|guided|learn)\b/.test(t)) return 'workshop';
  // Demo / showcase / live
  if (/\b(demo|showcase|launch|live (polling|betting)|setup|warcasting setup)\b/.test(t)) return 'demo';
  // Default to talk
  return 'talk';
}

function sessionsForDay(day, year) {
  return day.events.map(ev => ({
    title: cleanText(ev.title),
    speaker: cleanText(ev.hosts),
    rsvp: ev.rsvp,
    start: ev.start,
    end: ev.end,
    venue: ev.venue,
    description: ev.description,
  }));
}

function visibleSessions(day, year) {
  const seen = new Set();
  return sessionsForDay(day, year).filter(session => {
    if (shouldHide(session.title)) return false;

    let key = normalizeTitle(session.title) + '|' + cleanText(session.speaker).toLowerCase();
    if (/blood on the clocktower/i.test(session.title)) {
      key = 'blood on the clocktower|' + cleanText(session.speaker).toLowerCase();
    }
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function createSessionCard(session) {
  const card = document.createElement('div');
  card.className = 'session';
  const cat = categorize(session.title, session.speaker);
  card.dataset.cat = cat;
  card.innerHTML = `
    <div class="cat-label"></div>
    <div class="rsvp">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
      </svg>
      <span class="rsvp-count"></span>
    </div>
    <div class="title"></div>
    <div class="speaker"></div>`;
  const rsvpEl = card.querySelector('.rsvp');
  if (session.rsvp && Number(session.rsvp) > 0) {
    rsvpEl.querySelector('.rsvp-count').textContent = session.rsvp;
  } else {
    rsvpEl.remove();
  }
  card.querySelector('.cat-label').textContent = CAT_LABEL[cat] || cat;
  card.querySelector('.title').textContent = titleCase(session.title);
  const time = session.start && session.end ? `${session.start} – ${session.end}` : session.start;
  const tipLines = [];
  if (time) tipLines.push(time);
  if (session.venue) tipLines.push(session.venue);
  if (session.description) tipLines.push(session.description);
  if (tipLines.length) {
    card.classList.add('has-tooltip');
    if (time) card.dataset.tipTime = time;
    if (session.venue) card.dataset.tipVenue = session.venue;
    if (session.description) card.dataset.tipDescription = session.description;
    card.tabIndex = 0;
  }
  const speakerEl = card.querySelector('.speaker');
  const names = (session.speaker || '').split(',').map(s => s.trim()).filter(Boolean);
  speakerEl.textContent = '';
  names.forEach((name, i) => {
    const url = SPEAKER_LINKS[name];
    const el = document.createElement(url ? 'a' : 'span');
    el.className = 'speaker-name';
    el.textContent = name;
    if (url) {
      el.href = url;
      el.target = '_blank';
      el.rel = 'noopener noreferrer';
    }
    speakerEl.appendChild(el);
    if (i < names.length - 1) speakerEl.appendChild(document.createElement('br'));
  });
  return { card, cat };
}

function positionTooltip(card) {
  const gap = 12;
  const rect = card.getBoundingClientRect();
  const tipRect = tooltipEl.getBoundingClientRect();
  let top = rect.bottom + gap;
  let left = rect.left;

  if (left + tipRect.width > window.innerWidth - gap) left = window.innerWidth - tipRect.width - gap;
  if (left < gap) left = gap;
  if (top + tipRect.height > window.innerHeight - gap) {
    top = window.innerHeight - tipRect.height - gap;
  }
  if (top < gap) top = gap;

  tooltipEl.style.left = `${Math.round(left)}px`;
  tooltipEl.style.top = `${Math.round(top)}px`;
}

function showTooltip(card) {
  if (!card.dataset.tipTime && !card.dataset.tipVenue && !card.dataset.tipDescription) return;
  tooltipEl.textContent = '';
  const meta = document.createElement('div');
  meta.className = 'tooltip-meta';
  if (card.dataset.tipTime) {
    const time = document.createElement('span');
    time.textContent = card.dataset.tipTime;
    meta.appendChild(time);
  }
  if (card.dataset.tipVenue) {
    const venue = document.createElement('span');
    venue.className = 'tooltip-location';
    venue.textContent = card.dataset.tipVenue;
    meta.appendChild(venue);
  }
  if (meta.childNodes.length) tooltipEl.appendChild(meta);
  if (card.dataset.tipDescription) {
    const description = document.createElement('div');
    description.className = 'tooltip-description';
    description.textContent = card.dataset.tipDescription;
    tooltipEl.appendChild(description);
  }
  tooltipEl.classList.add('visible');
  positionTooltip(card);
}

function hideTooltip() {
  tooltipEl.classList.remove('visible');
  tooltipEl.textContent = '';
}

async function loadYear(year) {
  hideTooltip();
  document.body.className = 'year-' + year;
  document.querySelectorAll('nav.years button').forEach(b => {
    const active = b.dataset.year === year;
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', active);
  });

  const meta = META[year];
  const data = await fetch(YEAR_FILES[year]).then(r => r.json());

  // Year meta
  document.getElementById('year-meta').textContent = meta.dates;
  document.getElementById('footer-text').textContent = `Manifest ${year}`;
  const orgEl = document.getElementById('year-organizers');
  orgEl.textContent = '';
  meta.organizers.split(/\s*[,&]\s*/).forEach((name, i, arr) => {
    const url = SPEAKER_LINKS[name];
    const el = document.createElement(url ? 'a' : 'span');
    el.textContent = name;
    if (url) {
      el.href = url;
      el.target = '_blank';
      el.rel = 'noopener noreferrer';
    }
    orgEl.appendChild(el);
    if (i < arr.length - 1) orgEl.appendChild(document.createElement('br'));
  });

  // Render schedule
  const catOrder = Object.fromEntries(CATEGORIES.map((c, i) => [c.key, i]));
  const main = document.getElementById('schedule');
  main.innerHTML = '';
  for (const d of data) {
    const visible = visibleSessions(d, year);
    const sec = document.createElement('section');
    sec.className = 'day-section';
    sec.id = slugify(d.day);
    sec.innerHTML = `<h2 class="day">${d.day}</h2>`;
    const grid = document.createElement('div');
    grid.className = 'session-grid';

    const items = visible.map(s => createSessionCard(s));
    items.sort((a, b) => {
      const ai = catOrder[a.cat] ?? 99;
      const bi = catOrder[b.cat] ?? 99;
      return ai - bi;
    });
    for (const item of items) {
      grid.appendChild(item.card);
    }
    sec.appendChild(grid);
    main.appendChild(sec);
  }
}

document.querySelectorAll('nav.years button').forEach(btn => {
  btn.addEventListener('click', () => {
    loadYear(btn.dataset.year).then(() => { refreshFilterOptions(); applyFilter(); });
    history.replaceState(null, '', '#year-' + btn.dataset.year);
  });
});

// Filter dropdown
const filterSelect = document.getElementById('cat-filter');

function refreshFilterOptions() {
  const present = new Set();
  document.querySelectorAll('#schedule .session').forEach(c => present.add(c.dataset.cat));
  const previous = filterSelect.value || 'all';
  filterSelect.innerHTML = '<option value="all">All types</option>';
  for (const cat of CATEGORIES) {
    if (!present.has(cat.key)) continue;
    const opt = document.createElement('option');
    opt.value = cat.key;
    opt.textContent = cat.label;
    filterSelect.appendChild(opt);
  }
  filterSelect.value = present.has(previous) || previous === 'all' ? previous : 'all';
}

function applyFilter() {
  hideTooltip();
  const cat = filterSelect.value;
  document.querySelectorAll('.day-section').forEach(section => {
    let visibleCount = 0;
    section.querySelectorAll('.session').forEach(card => {
      const match = cat === 'all' || card.dataset.cat === cat;
      card.style.display = match ? '' : 'none';
      if (match) visibleCount++;
    });
    section.style.display = visibleCount === 0 ? 'none' : '';
  });
}

filterSelect.addEventListener('change', applyFilter);

document.getElementById('schedule').addEventListener('mouseover', event => {
  const card = event.target.closest('.session.has-tooltip');
  if (!card || card.contains(event.relatedTarget)) return;
  showTooltip(card);
});

document.getElementById('schedule').addEventListener('mouseout', event => {
  const card = event.target.closest('.session.has-tooltip');
  if (!card || card.contains(event.relatedTarget)) return;
  hideTooltip();
});

document.getElementById('schedule').addEventListener('focusin', event => {
  const card = event.target.closest('.session.has-tooltip');
  if (card) showTooltip(card);
});

document.getElementById('schedule').addEventListener('focusout', event => {
  const card = event.target.closest('.session.has-tooltip');
  if (!card || card.contains(event.relatedTarget)) return;
  hideTooltip();
});

window.addEventListener('scroll', () => {
  const card = document.querySelector('.session.has-tooltip:hover');
  if (card && tooltipEl.classList.contains('visible')) positionTooltip(card);
  else hideTooltip();
}, { passive: true });

window.addEventListener('resize', hideTooltip);

const initialYear = (location.hash.match(/year-(2023|2024|2025)/) || [,'2025'])[1];
loadYear(initialYear).then(() => { refreshFilterOptions(); applyFilter(); });
</script>
