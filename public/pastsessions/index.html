<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manifest Schedule — 2024 & 2025</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cinzel+Decorative:wght@400;700;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap");

  :root {
    --ink: #2b2419;
    --muted: #6b5f4f;
    --accent: #6f6a44;
    --bg: #ffffff;
    --card: #ffffff;
    --panel: #fbfaf7;
    --rule: #e6dccb;
    --font-cinzel: "Cinzel", serif;
    --font-cinzel-deco: "Cinzel Decorative", serif;
    --font-baskerville: "Libre Baskerville", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-baskerville);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 44px 32px 96px; }

  header.site {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 20px;
  }
  header.site h1 {
    font-family: var(--font-cinzel-deco);
    font-size: 34px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  header.site .sub { color: var(--muted); font-style: italic; }

  nav.years {
    display: flex;
    gap: 8px;
    width: fit-content;
    margin: 20px 0 18px;
    padding: 5px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 999px;
  }
  nav.years button {
    background: transparent;
    border: 0;
    padding: 8px 16px;
    font-family: var(--font-cinzel);
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-radius: 999px;
    transition: color 120ms, background 120ms;
  }
  nav.years button:hover { color: var(--ink); }
  nav.years button.active {
    background: #f1eadf;
    color: var(--accent);
    font-weight: 700;
  }

  .year-meta { font-size: 14px; color: var(--muted); margin-bottom: 22px; }

  .day-section {
    border-top: 1px solid var(--rule);
    padding-top: 22px;
    margin-top: 34px;
  }
  .day-section:first-child {
    margin-top: 0;
  }

  h2.day {
    font-family: var(--font-cinzel);
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 14px;
    color: var(--accent);
    scroll-margin-top: 80px;
  }
  h2.day .count {
    font-size: 14px;
    font-style: italic;
    color: var(--muted);
    font-weight: normal;
    margin-left: 8px;
  }
  .session-grid {
    column-count: 3;
    column-gap: 14px;
  }
  .session {
    background: var(--card);
    border: 1px solid var(--rule);
    padding: 10px 12px;
    border-radius: 6px;
    transition: transform 100ms;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(96px, 38%);
    grid-template-rows: auto 1fr;
    gap: 2px 12px;
    min-height: 86px;
    break-inside: avoid;
    margin: 0 0 10px;
  }
  .session:hover { transform: translateY(-1px); }
  .session .cat-label {
    font-family: var(--font-cinzel);
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.2px;
    font-weight: 600;
    color: #5d5547;
    opacity: 0.7;
    margin-bottom: 6px;
    grid-column: 1;
  }
  .session .title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 0;
    color: #2b2419;
    line-height: 1.28;
    grid-column: 1;
  }
  .session .speaker {
    font-family: var(--font-cinzel);
    font-size: 12px;
    color: #5d5547;
    font-style: italic;
    grid-column: 2;
    grid-row: 1 / 3;
    justify-self: end;
    align-self: end;
    text-align: right;
    overflow-wrap: anywhere;
  }

  /* Category palette — soft pastels */
  .session[data-cat="talk"]      { background: #edf5fa; border-color: #d6e8f2; }
  .session[data-cat="panel"]     { background: #fff8df; border-color: #f1e6b9; }
  .session[data-cat="workshop"]  { background: #edf8eb; border-color: #d2e8cf; }
  .session[data-cat="demo"]      { background: #e8f6ef; border-color: #cce6d9; }
  .session[data-cat="social"]    { background: #fdecea; border-color: #f1cbc5; }
  .session[data-cat="game"]      { background: #f2eaf8; border-color: #dccbe9; }
  .session[data-cat="performance"]{background: #fff0df; border-color: #f1d3b2; }
  .session[data-cat="wellness"]  { background: #f7edf5; border-color: #e5cfe0; }
  .session[data-cat="office"]    { background: #eaf6f8; border-color: #cee5ea; }

  footer.site {
    margin-top: 48px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  @media (max-width: 600px) {
    .wrap { padding: 24px 16px 60px; }
    header.site h1 { font-size: 28px; }
    h2.day { font-size: 22px; }
    .session-grid { column-count: 1; }
    .session { grid-template-columns: minmax(0, 1fr); }
    .session .speaker {
      grid-column: 1;
      grid-row: auto;
      justify-self: start;
      text-align: left;
    }
  }
</style>
</head>
<body class="year-2025">
<div class="wrap">
  <header class="site">
    <h1>Manifest Schedule</h1>
    <div class="sub">A festival of forecasting, prediction markets, and big ideas</div>
  </header>

  <nav class="years" role="tablist">
    <button data-year="2025" class="active" role="tab" aria-selected="true">Manifest 2025</button>
    <button data-year="2024" role="tab" aria-selected="false">Manifest 2024</button>
  </nav>

  <div id="year-meta" class="year-meta"></div>
  <main id="schedule"></main>

  <footer class="site">
    <span id="footer-text"></span>
  </footer>
</div>

<script>
const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

const META = {
  '2025': { dates: 'June 6–8, 2025' },
  '2024': { dates: 'June 7–9, 2024' },
};

const CATEGORIES = [
  { key: 'wellness',    label: 'Wellness'             },
  { key: 'social',      label: 'Social / Meetup'      },
  { key: 'game',        label: 'Game / Competition'   },
  { key: 'performance', label: 'Performance / Comedy' },
  { key: 'panel',       label: 'Panel / Q&A / Fireside' },
  { key: 'workshop',    label: 'Workshop / Class'     },
  { key: 'demo',        label: 'Demo / Office Hours'  },
  { key: 'talk',        label: 'Talk / Lecture'       },
];

const CAT_LABEL = Object.fromEntries(CATEGORIES.map(c => [c.key, c.label]));

const HIDE_PATTERNS = [
  /\blunch\b/i,
  /\bdinner\b/i,
  /\bbreakfast\b/i,
  /\bbrunch\b/i,
  /\bcuddle\b/i,
  /\bsex\b/i,
  /\bsexual\b/i,
  /\bsexy\b/i,
  /\bnsfw\b/i,
  /\bdoors?\s+open\b/i,
  /\bopening circle\b/i,
  /\bfestival kickoff\b/i,
  /\bkickoff\b/i,
  /\bregistration\b/i,
  /\bvolunteer training\b/i,
  /\bbreak\b/i,
  /\bclosing\b/i,
  /^\s*\[blocked/i,
];
function shouldHide(title) {
  const t = title || '';
  return HIDE_PATTERNS.some(rx => rx.test(t));
}

function cleanText(text) {
  return (text || '').replace(/\s+/g, ' ').trim();
}

function normalizeTitle(title) {
  return cleanText(title)
    .toLowerCase()
    .replace(/^possible\s+/, '')
    .replace(/[?!.,:;]+$/g, '');
}

function titleCase(text) {
  const smallWords = new Set(['a', 'an', 'and', 'as', 'at', 'but', 'by', 'for', 'from', 'in', 'into', 'nor', 'of', 'on', 'or', 'per', 'the', 'to', 'vs', 'via', 'with']);
  const acronyms = {
    ai: 'AI',
    agi: 'AGI',
    api: 'API',
    ea: 'EA',
    gpt: 'GPT',
    lgbt: 'LGBT',
    lgbtq: 'LGBTQ',
    llm: 'LLM',
    llms: 'LLMs',
    mats: 'MATS',
    nsfw: 'NSFW',
    qna: 'Q&A',
    'q&a': 'Q&A',
    rsvp: 'RSVP',
    usa: 'USA',
  };

  return cleanText(text)
    .split(' ')
    .map((word, index, words) => {
      const lower = word.toLowerCase();
      const bare = lower.replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, '');
      const prefix = word.match(/^[^a-z0-9]*/i)?.[0] || '';
      const suffix = word.match(/[^a-z0-9]*$/i)?.[0] || '';

      if (acronyms[bare]) return prefix + acronyms[bare] + suffix;
      if (word.includes('.') && /[a-z]/i.test(word)) {
        return word.charAt(0).toUpperCase() + word.slice(1);
      }
      if (/[a-z][A-Z]/.test(word.slice(1))) return word;
      if (index > 0 && index < words.length - 1 && smallWords.has(bare)) {
        return lower;
      }
      return word.replace(/\p{L}[\p{L}']*/gu, part =>
        part.charAt(0).toUpperCase() + part.slice(1).toLowerCase()
      );
    })
    .join(' ')
    .replace(/\bAi\b/g, 'AI')
    .replace(/\bQ&a\b/g, 'Q&A');
}

function categorize(title, hosts) {
  const t = (title || '').toLowerCase();
  const h = (hosts || '').toLowerCase();
  const all = t + ' || ' + h;

  // Wellness — yoga, meditation, jhana, dance class, hygge, barbell
  if (/\b(yoga|meditation|guided meditation|jhana|barbell|hygge|dance class|grieving|psychological growth|meditat)/.test(t)) return 'wellness';
  // Performance — comedy, karaoke, theater, screening, music, magic
  if (/\b(karaoke|comedy|theater|screening|movie|night market|dance party|stand[\s-]?up|music|magic|talent)\b/.test(t)) return 'performance';
  // Game / competition — poker, chess, trivia, clocktower, tournament, game show, cardinality, sock wrestle
  if (/\b(poker|chess|bughouse|trivia|tournament|clocktower|game show|cardinality|sock wrestle|origami|estimation game|nash pit|operant conditioning game|crystal coinflip|dumb pitch|pitch competition|startup pitch|speed friending|speed meeting|speedfriend|mentor.*mentee)\b/.test(t)) return 'game';
  // Social — meetup, mixer, party, hangout, gathering, social, friends, lgbt, parents, founders meetup
  if (/\b(meetup|mixer|party|hangout|gathering|social|meet[\s-]?up|friends?|lgbt|gay|parents meetup|founders meetup|shabbat|whales|degens|mira|founders meetup)\b/.test(all)) return 'social';
  // Office Hours / Q&A / Fireside / Panel
  if (/\b(office hours|q&a|q ?and ?a|fireside|panel|debate|interviews?|conversation|discussion)\b/.test(t)) return 'panel';
  // Workshop / class / training / build-a-bot / lesson
  if (/\b(workshop|class|training|build[\s-]?a[\s-]?bot|how to|intro to|101|tutorial|exercise|hands[\s-]?on|guided|learn)\b/.test(t)) return 'workshop';
  // Demo / showcase / live
  if (/\b(demo|showcase|launch|live (polling|betting)|setup|warcasting setup)\b/.test(t)) return 'demo';
  // Default to talk
  return 'talk';
}

function sessionsForDay(day, year) {
  if (year === '2025') {
    return day.slots.flatMap(slot =>
      slot.sessions.map(s => ({ title: cleanText(s.title), speaker: cleanText(s.speaker) }))
    );
  }
  return day.events.map(ev => ({ title: cleanText(ev.title), speaker: cleanText(ev.hosts) }));
}

function visibleSessions(day, year) {
  const seen = new Set();
  return sessionsForDay(day, year).filter(session => {
    if (shouldHide(session.title)) return false;

    let key = normalizeTitle(session.title) + '|' + cleanText(session.speaker).toLowerCase();
    if (/blood on the clocktower/i.test(session.title)) {
      key = 'blood on the clocktower|' + cleanText(session.speaker).toLowerCase();
    }
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function createSessionCard(session) {
  const card = document.createElement('div');
  card.className = 'session';
  const cat = categorize(session.title, session.speaker);
  card.dataset.cat = cat;
  card.innerHTML = `
    <div class="cat-label"></div>
    <div class="title"></div>
    <div class="speaker"></div>`;
  card.querySelector('.cat-label').textContent = CAT_LABEL[cat] || cat;
  card.querySelector('.title').textContent = titleCase(session.title);
  card.querySelector('.speaker').textContent = session.speaker;
  return { card, cat };
}

async function loadYear(year) {
  document.body.className = 'year-' + year;
  document.querySelectorAll('nav.years button').forEach(b => {
    const active = b.dataset.year === year;
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', active);
  });

  const meta = META[year];
  const data = await fetch(year === '2025' ? '/pastsessions/events-2025.json' : '/pastsessions/events.json').then(r => r.json());

  // Year meta
  document.getElementById('year-meta').textContent = meta.dates;
  document.getElementById('footer-text').textContent = `Manifest ${year}`;

  // Render schedule
  const main = document.getElementById('schedule');
  main.innerHTML = '';
  for (const d of data) {
    const visible = visibleSessions(d, year);
    const sec = document.createElement('section');
    sec.className = 'day-section';
    sec.id = slugify(d.day);
    sec.innerHTML = `<h2 class="day">${d.day}</h2>`;
    const grid = document.createElement('div');
    grid.className = 'session-grid';

    for (const s of visible) {
      const item = createSessionCard(s);
      grid.appendChild(item.card);
    }
    sec.appendChild(grid);
    main.appendChild(sec);
  }
}

document.querySelectorAll('nav.years button').forEach(btn => {
  btn.addEventListener('click', () => {
    loadYear(btn.dataset.year);
    history.replaceState(null, '', '#year-' + btn.dataset.year);
  });
});

const initialYear = (location.hash.match(/year-(2024|2025)/) || [,'2025'])[1];
loadYear(initialYear);
</script>
</body>
</html>
